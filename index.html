<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Please Forgive Me 🥺</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1 id="title">I'm really sorry Hannah'🥺</h1>
    <p id="msg">
      I made a mistake and I regret it 💔<br>
      Please forgive me?
    </p>

    <div class="buttons">
      <button class="yes" onclick="forgiven()">Yes 💖</button>
      <button class="no" onmouseover="moveNo()">No 😭</button>
    </div>
  </div>

<script>
  let clickCount = 0;

  function forgiven() {
    clickCount++;

    if (clickCount === 1) {
      document.getElementById("title").innerText = "Thank you 😭💖";
      document.getElementById("msg").innerHTML =
        "I hope you beleive me.I deserve you🫶<br>You mean everything to me 💕";
    } else if (clickCount === 2) {
      document.getElementById("msg").innerHTML =
        "From my heart to yours ❤️<br>Thank you for giving me another chance and I wont hurt you again,by doing the same thing. Hannah'🥹✨";

      // Remove Yes button
      const yesBtn = document.querySelector(".yes");
      yesBtn.remove();

      // create hug button
      const hugBtn = document.createElement("button");
      hugBtn.innerText = "Hug 🤗";
      hugBtn.className = "hug";
      hugBtn.onclick = () => {
        window.location.href = "hug.html"; // go to hug page
      };
      document.querySelector(".buttons").appendChild(hugBtn);
    }
  }

  function moveNo() {
    const noBtn = document.querySelector(".no");
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 200 - 100;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  }
</script>
</body>
</html>
