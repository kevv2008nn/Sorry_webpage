<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Please Forgive Me 🥺</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1 id="title">I'm really sorry 🥺</h1>
    <p id="msg">
      I made a mistake and I regret it 💔<br>
      Please forgive me?
    </p>

    <div class="buttons">
      <button class="yes" onclick="forgiven()">Yes 💖</button>
      <button class="no" onmouseover="moveNo()">No 😭</button>
    </div>
  </div>

  <script>
  function forgiven() {
    document.getElementById("title").innerText = "Thank you 😭💖";
    document.getElementById("msg").innerHTML =
      "I promise I'll never do it again 🫶<br>You mean everything to me 💕";

    // show final message after 2 seconds
    setTimeout(() => {
      document.getElementById("msg").innerHTML =
        "From my heart to yours ❤️<br>Thank you for giving me another chance 🥹✨";
    }, 2000);
  }

  function moveNo() {
    const noBtn = document.querySelector(".no");
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 200 - 100;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  }
</script>


</body>
</html>
