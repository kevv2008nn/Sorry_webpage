<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hug Album 🤗</title>
<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(to bottom right, #fcd5ce, #ffafcc);
  font-family: 'Arial', sans-serif;
}

.romantic-word {
  font-family: 'Cursive', 'Segoe Script', sans-serif;
  font-size: 80px;
  font-weight: bold;
  background: linear-gradient(45deg, #ff0044, #ff3366, #ff6699);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 2px 2px 12px rgba(0, 0, 0, 0.4);
  letter-spacing: 3px;
  transition: transform 0.3s, text-shadow 0.3s;
  margin-bottom: 40px;
}

.romantic-word:hover {
  transform: scale(1.2) rotate(-2deg);
  text-shadow: 4px 4px 14px rgba(255, 105, 180, 0.8);
  cursor: pointer;
}

.hug-box {
  padding: 20px 40px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  backdrop-filter: blur(5px);
  font-size: 24px;
  font-weight: bold;
  color: #ff0044;
  animation: fadeIn 2s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<h1 class="romantic-word">Amour</h1>
<div class="hug-box">Hug Received 🤗</div>

</body>
</html>
